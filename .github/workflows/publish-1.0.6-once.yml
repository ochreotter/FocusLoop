name: Publish FocusLoop 1.0.6 (one-shot)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-1.0.6-once.yml'

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'ochreotter/FocusLoop'
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout tested 1.0.6 source
        uses: actions/checkout@v7
        with:
          ref: 465dfd7a3bea19dc793fe238e52da02c06da2167
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install build dependencies
        run: python -m pip install -r requirements.txt "pyinstaller>=6.10,<7"
      - name: Verify version and asset filename
        run: python -c "from focusloop.updates import VERSION, ASSET_NAME; assert VERSION == '1.0.6'; assert ASSET_NAME == 'FocusLoop-Windows.zip'"
      - name: Re-run Python unit and Windows Qt UI regression tests
        shell: pwsh
        run: |
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { throw 'Unit tests failed' }
          python -m unittest discover -s tests/ui -v
          if ($LASTEXITCODE -ne 0) { throw 'Qt UI tests failed' }
      - name: Generate application icon
        run: python -m scripts.generate_icon
      - name: Build Windows onedir executable
        run: pyinstaller --noconfirm --clean --onedir --windowed --icon .build/FocusLoop.ico --name FocusLoop main.py
      - name: Package ZIP and include licenses (retry transient downloads)
        shell: pwsh
        run: |
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            python -m scripts.package_windows
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -eq 3) { throw 'Windows packaging failed after three attempts' }
            Start-Sleep -Seconds 5
          }
      - name: Check Windows ZIP
        shell: pwsh
        run: |
          if (-not (Test-Path 'dist/FocusLoop-Windows.zip')) { throw 'Missing Windows ZIP' }
          if ((Get-Item 'dist/FocusLoop-Windows.zip').Length -lt 100000) { throw 'Windows ZIP unexpectedly small' }
      - name: Create draft, tag and publish 1.0.6
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          gh release create 1.0.6 dist/FocusLoop-Windows.zip --repo $env:GITHUB_REPOSITORY --target '465dfd7a3bea19dc793fe238e52da02c06da2167' --title 'FocusLoop 1.0.6' --notes-file docs/releases/1.0.6.md --draft
          if ($LASTEXITCODE -ne 0) { throw 'Draft release creation failed' }
          gh api --method POST "repos/$env:GITHUB_REPOSITORY/git/refs" -f ref='refs/tags/1.0.6' -f sha='465dfd7a3bea19dc793fe238e52da02c06da2167'
          if ($LASTEXITCODE -ne 0) { throw 'Tag creation failed; draft remains unpublished' }
          gh release edit 1.0.6 --repo $env:GITHUB_REPOSITORY --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed; draft remains unpublished' }

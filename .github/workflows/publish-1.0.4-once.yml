name: Publish FocusLoop 1.0.4 (one-shot)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-1.0.4-once.yml'

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'ochreotter/FocusLoop'
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout tested 1.0.4 commit
        uses: actions/checkout@v7
        with:
          ref: e1d6bc5d6e8141621d13a25d6aa8728603fb1fce
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install build dependencies
        run: python -m pip install -r requirements.txt "pyinstaller>=6.10,<7"
      - name: Verify version and asset name
        run: python -c "from focusloop.updates import VERSION, ASSET_NAME; assert VERSION == '1.0.4'; assert ASSET_NAME == 'FocusLoop-Windows.zip'"
      - name: Repeat unit and Qt UI regression tests
        shell: pwsh
        run: |
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { throw 'Unit regressions failed' }
          python -m unittest discover -s tests/ui -v
          if ($LASTEXITCODE -ne 0) { throw 'Qt UI regressions failed' }
      - name: Generate application icon
        run: python -m scripts.generate_icon
      - name: Build Windows onedir application
        run: pyinstaller --noconfirm --clean --onedir --windowed --icon .build/FocusLoop.ico --name FocusLoop main.py
      - name: Package ZIP with licenses
        run: python -m scripts.package_windows
      - name: Verify ZIP output
        shell: pwsh
        run: |
          if (-not (Test-Path 'dist/FocusLoop-Windows.zip')) { throw 'Release ZIP missing' }
          if ((Get-Item 'dist/FocusLoop-Windows.zip').Length -lt 100000) { throw 'Release ZIP unexpectedly small' }
      - name: Create, tag, and publish FocusLoop 1.0.4
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          gh release create 1.0.4 dist/FocusLoop-Windows.zip --repo $env:GITHUB_REPOSITORY --target 'e1d6bc5d6e8141621d13a25d6aa8728603fb1fce' --title 'FocusLoop 1.0.4' --notes-file docs/releases/1.0.4.md --draft
          if ($LASTEXITCODE -ne 0) { throw 'Draft release creation failed' }
          gh api --method POST "repos/$env:GITHUB_REPOSITORY/git/refs" -f ref='refs/tags/1.0.4' -f sha='e1d6bc5d6e8141621d13a25d6aa8728603fb1fce'
          if ($LASTEXITCODE -ne 0) { throw 'Tag creation failed; draft remains unpublished' }
          gh release edit 1.0.4 --repo $env:GITHUB_REPOSITORY --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed; draft remains unpublished' }

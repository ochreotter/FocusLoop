name: Create initial FocusLoop 1.0.0 draft (one-shot)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/create-initial-1.0.0-draft.yml'

permissions:
  contents: write

jobs:
  create-initial-draft:
    if: github.repository == 'ochreotter/FocusLoop'
    runs-on: windows-latest
    steps:
      - name: Checkout approved release source
        uses: actions/checkout@v7
        with:
          ref: 9a1f8fe0690c556374e33e0f3268b1a185f60f17
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies and bundler
        run: python -m pip install -r requirements.txt "pyinstaller>=6.10,<7"
      - name: Verify initial release version
        run: python -c "from focusloop.updates import VERSION, ASSET_NAME; assert VERSION == '1.0.0'; assert ASSET_NAME == 'FocusLoop-Windows.zip'"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Generate icon
        run: python -m scripts.generate_icon
      - name: Build Windows onedir EXE
        run: pyinstaller --noconfirm --clean --onedir --windowed --icon .build/FocusLoop.ico --name FocusLoop main.py
      - name: Package ZIP with licensing notices
        run: python -m scripts.package_windows
      - name: Verify ZIP
        shell: pwsh
        run: |
          if (-not (Test-Path dist/FocusLoop-Windows.zip)) { throw 'Release ZIP is missing' }
          if ((Get-Item dist/FocusLoop-Windows.zip).Length -lt 100000) { throw 'Release ZIP is too small' }
      - name: Create tag and DRAFT Release (do not publish)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create 1.0.0 dist/FocusLoop-Windows.zip --repo ${{ github.repository }} --target '9a1f8fe0690c556374e33e0f3268b1a185f60f17' --title 'FocusLoop 1.0.0' --notes-file docs/releases/1.0.0.md --draft

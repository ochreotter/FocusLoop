name: Finalize initial FocusLoop 1.0.0 draft tag (one-shot)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/create-initial-1.0.0-draft.yml'

permissions:
  contents: write

jobs:
  create-tag:
    if: github.repository == 'ochreotter/FocusLoop'
    runs-on: ubuntu-latest
    steps:
      - name: Verify existing Draft Release and create 1.0.0 Git tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view 1.0.0 --repo "${GITHUB_REPOSITORY}" --json isDraft,assets \
            --jq 'if .isDraft and ([.assets[].name] | index("FocusLoop-Windows.zip") != null) then "Draft ZIP verified" else error("Draft release or ZIP missing") end'
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/1.0.0" \
            -f sha="9a1f8fe0690c556374e33e0f3268b1a185f60f17"

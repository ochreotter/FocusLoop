name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt "pyinstaller>=6.10,<7"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Generate Windows Clock icon
        run: python -m scripts.generate_icon
      - name: Build application with replaceable DLLs
        run: pyinstaller --noconfirm --clean --onedir --windowed --icon .build/FocusLoop.ico --name FocusLoop main.py
      - name: Package application with license texts and notices
        run: python -m scripts.package_windows
      - name: Upload Windows ZIP artifact
        uses: actions/upload-artifact@v7
        with:
          name: FocusLoop-Windows
          path: dist/FocusLoop-Windows.zip
          if-no-files-found: error

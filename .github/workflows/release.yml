name: Draft Windows Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt "pyinstaller>=6.10,<7"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Generate Windows Clock icon
        run: python -m scripts.generate_icon
      - name: Build application with replaceable Qt DLLs
        run: pyinstaller --noconfirm --clean --onedir --windowed --icon .build/FocusLoop.ico --name FocusLoop main.py
      - name: Package Windows ZIP and legal notices
        run: python -m scripts.package_windows
      - name: Check release ZIP exists
        shell: pwsh
        run: |
          if (!(Test-Path dist/FocusLoop-Windows.zip)) {
            throw 'The Windows release archive is missing'
          }
      - name: Create or update DRAFT Release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/FocusLoop-Windows.zip
          body: |
            FocusLoop のWindows版です。FocusLoop-Windows.zipをダウンロードし、
            ZIP内のFocusLoopフォルダーを展開してFocusLoop.exeを起動してください。
            EXEと同じフォルダー内のDLLなどは削除・移動しないでください。

            アプリ本体はMITライセンスです。PySide6/Qtなど同梱ライブラリの
            著作権・ライセンス情報と差し替え方法はZIP内の
            LICENSE、THIRD_PARTY_NOTICES.md、LIBRARY_REPLACEMENT.md、
            licenses/をご覧ください。

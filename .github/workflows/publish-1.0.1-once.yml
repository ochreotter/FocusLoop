name: Publish FocusLoop 1.0.1 (one-shot)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-1.0.1-once.yml'

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'ochreotter/FocusLoop'
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout verified 1.0.1 source
        uses: actions/checkout@v7
        with:
          ref: ef12a4613823f716fc77f0245f7a4667e6e8abf8
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt "pyinstaller>=6.10,<7"
      - name: Verify app version and package name
        run: python -c "from focusloop.updates import VERSION, ASSET_NAME; assert VERSION == '1.0.1'; assert ASSET_NAME == 'FocusLoop-Windows.zip'"
      - name: Unit and UI regression tests
        shell: pwsh
        run: |
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { throw 'Unit tests failed' }
          python -m unittest discover -s tests/ui -v
          if ($LASTEXITCODE -ne 0) { throw 'Windows UI tests failed' }
      - name: Generate Windows Clock icon
        run: python -m scripts.generate_icon
      - name: Build onedir application
        run: pyinstaller --noconfirm --clean --onedir --windowed --icon .build/FocusLoop.ico --name FocusLoop main.py
      - name: Package Windows ZIP with licenses
        run: python -m scripts.package_windows
      - name: Verify release ZIP and tag availability
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if (-not (Test-Path 'dist/FocusLoop-Windows.zip')) { throw 'Release ZIP missing' }
          if ((Get-Item 'dist/FocusLoop-Windows.zip').Length -lt 100000) { throw 'Release ZIP unexpectedly small' }
          gh release view 1.0.1 --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { throw 'Release 1.0.1 already exists; refusing to overwrite it' }
          gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/1.0.1" *> $null
          if ($LASTEXITCODE -eq 0) { throw 'Git tag 1.0.1 already exists; refusing to move it' }
      - name: Create Draft Release, tag, and publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          gh release create 1.0.1 dist/FocusLoop-Windows.zip --repo $env:GITHUB_REPOSITORY --target 'ef12a4613823f716fc77f0245f7a4667e6e8abf8' --title 'FocusLoop 1.0.1' --notes-file docs/releases/1.0.1.md --draft
          if ($LASTEXITCODE -ne 0) { throw 'Draft release creation failed' }
          gh api --method POST "repos/$env:GITHUB_REPOSITORY/git/refs" -f ref='refs/tags/1.0.1' -f sha='ef12a4613823f716fc77f0245f7a4667e6e8abf8'
          if ($LASTEXITCODE -ne 0) { throw 'Could not create Git tag; draft remains unpublished' }
          gh release edit 1.0.1 --repo $env:GITHUB_REPOSITORY --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish 1.0.1; draft remains unpublished' }

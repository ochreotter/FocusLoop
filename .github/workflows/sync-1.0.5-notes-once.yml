name: Sync FocusLoop 1.0.5 release notes (one-shot)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-1.0.5-notes-once.yml'

permissions:
  contents: write

jobs:
  sync:
    if: github.repository == 'ochreotter/FocusLoop'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update published GitHub Release description
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit 1.0.5 --repo "$GITHUB_REPOSITORY" --notes-file docs/releases/1.0.5.md
      - name: Confirm Release remains published
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view 1.0.5 --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,isPrerelease --jq '.tagName + " draft=" + (.isDraft|tostring) + " prerelease=" + (.isPrerelease|tostring)'

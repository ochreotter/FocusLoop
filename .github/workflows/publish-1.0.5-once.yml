name: Publish FocusLoop 1.0.5 (one-shot)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-1.0.5-once.yml'

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'ochreotter/FocusLoop'
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout tested 1.0.5 commit
        uses: actions/checkout@v7
        with:
          ref: 27e97d8bb749a1262723b0577346d07729a869b4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install build dependencies
        run: python -m pip install -r requirements.txt "pyinstaller>=6.10,<7"
      - name: Verify version and asset name
        run: python -c "from focusloop.updates import VERSION, ASSET_NAME; assert VERSION == '1.0.5'; assert ASSET_NAME == 'FocusLoop-Windows.zip'"
      - name: Repeat unit and Qt UI regression tests
        shell: pwsh
        run: |
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { throw 'Unit regressions failed' }
          python -m unittest discover -s tests/ui -v
          if ($LASTEXITCODE -ne 0) { throw 'Qt UI regressions failed' }
      - name: Generate application icon
        run: python -m scripts.generate_icon
      - name: Build Windows onedir application
        run: pyinstaller --noconfirm --clean --onedir --windowed --icon .build/FocusLoop.ico --name FocusLoop main.py
      - name: Package ZIP with licenses (retry transient downloads)
        shell: pwsh
        run: |
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            python -m scripts.package_windows
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -eq 3) { throw 'Windows ZIP packaging failed after retries' }
            Start-Sleep -Seconds 5
          }
      - name: Verify release ZIP
        shell: pwsh
        run: |
          if (-not (Test-Path 'dist/FocusLoop-Windows.zip')) { throw 'Release ZIP missing' }
          if ((Get-Item 'dist/FocusLoop-Windows.zip').Length -lt 100000) { throw 'Release ZIP unexpectedly small' }
      - name: Create, tag, and publish FocusLoop 1.0.5
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          gh release create 1.0.5 dist/FocusLoop-Windows.zip --repo $env:GITHUB_REPOSITORY --target '27e97d8bb749a1262723b0577346d07729a869b4' --title 'FocusLoop 1.0.5' --notes-file docs/releases/1.0.5.md --draft
          if ($LASTEXITCODE -ne 0) { throw 'Draft release creation failed' }
          gh api --method POST "repos/$env:GITHUB_REPOSITORY/git/refs" -f ref='refs/tags/1.0.5' -f sha='27e97d8bb749a1262723b0577346d07729a869b4'
          if ($LASTEXITCODE -ne 0) { throw 'Tag creation failed; draft remains unpublished' }
          gh release edit 1.0.5 --repo $env:GITHUB_REPOSITORY --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed; draft remains unpublished' }

name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Logic and syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check Python syntax
        run: python -m compileall -q main.py focusloop tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  ui:
    name: Settings UI smoke test
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Qt dependencies
        run: python -m pip install -r requirements.txt
      - name: Run UI smoke tests
        run: python -m unittest discover -s tests/ui -v

  package:
    name: Windows release package smoke test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies and bundler
        run: python -m pip install -r requirements.txt "pyinstaller>=6.10,<7"
      - name: Generate Windows Clock icon
        run: python -m scripts.generate_icon
      - name: Build onedir application
        run: pyinstaller --noconfirm --clean --onedir --windowed --icon .build/FocusLoop.ico --name FocusLoop main.py
      - name: Verify packaged licensing files and ZIP
        run: python -m scripts.package_windows
      - name: Upload release candidate (test only)
        uses: actions/upload-artifact@v7
        with:
          name: FocusLoop-Windows-PR-Candidate
          path: dist/FocusLoop-Windows.zip
          if-no-files-found: error

name: Publish FocusLoop 1.0.3 (one-shot)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-1.0.3-once.yml'

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'ochreotter/FocusLoop'
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout verified 1.0.3 source
        uses: actions/checkout@v7
        with:
          ref: 114e963c09e099b1f57d6ac6f52a7582322beadb
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt "pyinstaller>=6.10,<7"
      - name: Verify version and asset filename
        run: python -c "from focusloop.updates import VERSION, ASSET_NAME; assert VERSION == '1.0.3'; assert ASSET_NAME == 'FocusLoop-Windows.zip'"
      - name: Run unit and Windows UI regression tests
        shell: pwsh
        run: |
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { throw 'Unit tests failed' }
          python -m unittest discover -s tests/ui -v
          if ($LASTEXITCODE -ne 0) { throw 'UI tests failed' }
      - name: Generate Windows Clock icon
        run: python -m scripts.generate_icon
      - name: Build onedir application
        run: pyinstaller --noconfirm --clean --onedir --windowed --icon .build/FocusLoop.ico --name FocusLoop main.py
      - name: Package Windows ZIP with licenses
        run: python -m scripts.package_windows
      - name: Verify release ZIP
        shell: pwsh
        run: |
          if (-not (Test-Path 'dist/FocusLoop-Windows.zip')) { throw 'Release ZIP missing' }
          if ((Get-Item 'dist/FocusLoop-Windows.zip').Length -lt 100000) { throw 'Release ZIP unexpectedly small' }
      - name: Create Draft Release, tag, and publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          gh release create 1.0.3 dist/FocusLoop-Windows.zip --repo $env:GITHUB_REPOSITORY --target '114e963c09e099b1f57d6ac6f52a7582322beadb' --title 'FocusLoop 1.0.3' --notes-file docs/releases/1.0.3.md --draft
          if ($LASTEXITCODE -ne 0) { throw 'Draft release creation failed' }
          gh api --method POST "repos/$env:GITHUB_REPOSITORY/git/refs" -f ref='refs/tags/1.0.3' -f sha='114e963c09e099b1f57d6ac6f52a7582322beadb'
          if ($LASTEXITCODE -ne 0) { throw 'Tag creation failed; draft remains unpublished' }
          gh release edit 1.0.3 --repo $env:GITHUB_REPOSITORY --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Publication failed; draft remains unpublished' }
